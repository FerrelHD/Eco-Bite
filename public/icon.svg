<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52B788" />
      <stop offset="100%" stop-color="#2D6A4F" />
    </linearGradient>
    <!-- Bowl / Inner Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#D8F3DC" />
    </linearGradient>
  </defs>
  <!-- iOS App Icon Squircle Base -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <!-- Eco Bowl Base (Representing Food & Nutrition) -->
  <path d="M128 260 C 128 370, 384 370, 384 260 Z" fill="url(#leafGrad)" />
  <!-- Stylized Sprout / Leaves Rising From Bowl -->
  <!-- Left Leaf -->
  <path d="M256 250 C 210 210, 160 210, 160 150 C 220 150, 250 200, 256 250 Z" fill="#D8F3DC" />
  <!-- Right Leaf with subtle Bite Detail -->
  <path d="M256 250 C 302 210, 352 210, 352 150 C 292 150, 262 200, 256 250 Z" fill="#FFFFFF" />
  <!-- Steam / Aroma Ring (Clean Accent) -->
  <circle cx="256" cy="120" r="14" fill="#D8F3DC" opacity="0.8" />
</svg>
